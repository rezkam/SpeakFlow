name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            xcode: '26.0'

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    name: ${{ matrix.os }} (Xcode ${{ matrix.xcode }})

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: .build/checkouts
          key: ${{ runner.os }}-${{ matrix.xcode }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.xcode }}-spm-

      - name: Resolve dependencies
        run: swift package resolve

      - name: Validate release scripts
        run: bash -n scripts/build-release.sh scripts/verify-release-artifact.sh

      - name: Install SwiftLint
        run: brew install swiftlint

      # Errors fail the job (default exit code 2 on error-level violations).
      # Warnings are reported via GitHub annotations but do not fail; warning
      # debt is tracked separately and trimmed incrementally.
      - name: Lint
        run: swiftlint lint --quiet --reporter github-actions-logging

      - name: Build
        run: swift build --build-tests

      - name: Main feature regression suite
        env:
          SPEAKFLOW_MUTE_SOUNDS: '1'
          SPEAKFLOW_ISOLATE_TEST_AUDIO: '1'
        run: SPEAKFLOW_REGRESSION_SKIP_BUILD=1 ./scripts/test-regression-core.sh

      # Full-suite tests share process-wide runtime resources, so serialize them to match
      # the strict local check. Focused and regression filters still provide isolated coverage.
      - name: Test
        env:
          SPEAKFLOW_MUTE_SOUNDS: '1'
          SPEAKFLOW_ISOLATE_TEST_AUDIO: '1'
        run: swift test --skip-build --no-parallel

      - name: Build release
        run: swift build -c release --product SpeakFlow
